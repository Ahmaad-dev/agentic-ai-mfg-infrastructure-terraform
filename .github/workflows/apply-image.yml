name: apply-image
on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: terraform init
        working-directory: infra
        run: terraform init -backend-config=backend.tfvars

      - name: Verify initial infrastructure apply completed
        working-directory: infra
        run: |
          terraform state list | grep -qx 'module.manual_resources.azurerm_resource_group.manual' || {
            echo "Initial infrastructure apply is required before image-only updates."
            exit 1
          }

      - name: Plan new image tag
        working-directory: infra
        env:
          TF_VAR_image_tag: ${{ inputs.image_tag }}
          TF_VAR_smart_planning_client_secret: ${{ secrets.SMART_PLANNING_CLIENT_SECRET }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_notification_recipient_email: ${{ secrets.NOTIFICATION_RECIPIENT_EMAIL }}
        run: terraform plan -input=false -out=tf.plan

      - name: Apply planned image tag
        working-directory: infra
        env:
          TF_VAR_image_tag: ${{ inputs.image_tag }}
          TF_VAR_smart_planning_client_secret: ${{ secrets.SMART_PLANNING_CLIENT_SECRET }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_notification_recipient_email: ${{ secrets.NOTIFICATION_RECIPIENT_EMAIL }}
        run: terraform apply -auto-approve tf.plan

      - name: Output Deployment Info
        run: |
          echo "✅ Image updated to: ${{ inputs.image_tag }}"
