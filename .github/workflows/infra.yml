name: infra
on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TF_VAR_prefix: agenticai
      TF_VAR_location: "Sweden Central"
      TF_VAR_owner_tag: "ahmad.alsayad@cca-dev.com"
      TF_VAR_rg_name: rg-agentic-ai-mfg-prod
      TF_VAR_acr_name: acragenticaimfg
      TF_VAR_kv_name: kv-agentic-ai-mfg
      TF_VAR_sa_name: stagenticaimfg
      TF_VAR_cae_name: cae-agentic-ai-mfg
      TF_VAR_ca_name: ca-agentic-ai-backend
      TF_VAR_mi_name: mi-agentic-ai-mfg
      
      # Sensitive Variables aus GitHub Secrets
      TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      TF_VAR_azure_search_admin_key: ${{ secrets.AZURE_SEARCH_ADMIN_KEY }}
      TF_VAR_client_secret: ${{ secrets.CLIENT_SECRET }}
      TF_VAR_azure_speech_key: ${{ secrets.AZURE_SPEECH_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Ensure tfstate storage exists
        run: |
          # Resource Group für tfstate
          az group create \
            --name rg-agentic-ai-mfg-manual \
            --location "Sweden Central" \
            --tags Owner=ahmad.alsayad@cca-dev.com || true
          
          # Storage Account für tfstate
          az storage account create \
            --name tfstateagenticaimfg \
            --resource-group rg-agentic-ai-mfg-manual \
            --location "Sweden Central" \
            --sku Standard_ZRS \
            --tags Owner=ahmad.alsayad@cca-dev.com || true
          
          # Container für tfstate
          az storage container create \
            --name agentic-ai-tfstate \
            --account-name tfstateagenticaimfg || true

      - name: terraform init
        working-directory: infra
        run: terraform init -backend-config=backend.tfvars

      - name: terraform validate
        working-directory: infra
        run: terraform validate

      - name: terraform plan
        working-directory: infra
        run: terraform plan -out=tf.plan

      - name: terraform apply
        working-directory: infra
        run: terraform apply -auto-approve tf.plan

      # - name: Output Container App URL
      #   working-directory: infra
      #   run: |
      #     echo "Container App URL:"
      #     terraform output -raw container_app_url
