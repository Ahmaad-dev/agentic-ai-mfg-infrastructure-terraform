name: infra
on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed Terraform plan
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      # Sensitive Variables aus GitHub Secrets
      TF_VAR_smart_planning_client_secret: ${{ secrets.SMART_PLANNING_CLIENT_SECRET }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_notification_recipient_email: ${{ secrets.NOTIFICATION_RECIPIENT_EMAIL }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Ensure tfstate storage exists
        run: |
          # Resource Group für tfstate
          az group create \
            --name rg-agentic-ai-mfg-manual \
            --location "Sweden Central" \
            --tags Owner=ahmad.alsayad@cca-dev.com || true
          
          # Storage Account für tfstate
          az storage account create \
            --name tfstateagenticaimfg \
            --resource-group rg-agentic-ai-mfg-manual \
            --location "Sweden Central" \
            --sku Standard_ZRS \
            --tags Owner=ahmad.alsayad@cca-dev.com || true
          
          # Container für tfstate
          az storage container create \
            --name agentic-ai-tfstate \
            --account-name tfstateagenticaimfg || true

      - name: terraform init
        working-directory: infra
        run: terraform init -backend-config=backend.tfvars

      - name: terraform validate
        working-directory: infra
        run: terraform validate

      - name: terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=tf.plan

      - name: terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        working-directory: infra
        run: terraform apply -auto-approve tf.plan
